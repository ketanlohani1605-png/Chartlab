name: Build Mac app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore folders (files were uploaded flat, @ means folder)
        run: |
          for f in *@*; do
            [ -f "$f" ] || continue
            t="${f//@//}"
            mkdir -p "$(dirname "$t")"
            mv "$f" "$t"
          done
          ls -R . | head -60
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Test core
        run: python tests/test_core.py
      - name: Build ChartLab.app
        run: |
          pyinstaller --noconfirm --windowed --name ChartLab \
            --add-data "strategies:strategies" \
            --add-data "providers:providers" \
            --add-data "assets:assets" \
            --icon assets/icon.icns \
            --collect-submodules chartlab \
            --collect-submodules yfinance \
            --collect-submodules pyqtgraph --collect-data pyqtgraph \
            main.py
      - name: Check the built app starts in MCP mode
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' | dist/ChartLab.app/Contents/MacOS/ChartLab --mcp | head -c 300
      - name: Zip app
        run: ditto -c -k --keepParent dist/ChartLab.app ChartLab-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ChartLab-mac
          path: ChartLab-mac.zip

