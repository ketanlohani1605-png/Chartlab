name: Build Mac app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-m1:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore folders (files were uploaded flat, @ means folder)
        run: |
          for f in *@*; do
            [ -f "$f" ] || continue
            t="${f//@//}"
            mkdir -p "$(dirname "$t")"
            mv "$f" "$t"
          done
          ls -R . | head -60
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Test core
        run: python tests/test_core.py
      - name: Build ChartLab.app
        run: |
          pyinstaller --noconfirm --windowed --name ChartLab \
            --osx-bundle-identifier com.chartlab.app \
            --add-data "strategies:strategies" \
            --add-data "providers:providers" \
            --add-data "assets:assets" \
            --icon assets/icon.icns \
            --collect-submodules chartlab \
            --collect-submodules yfinance \
            --collect-submodules pyqtgraph --collect-data pyqtgraph \
            main.py
      - name: Stamp the version into the app and sign it again
        run: |
          V=$(python -c "import chartlab; print(chartlab.__version__)")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          P=dist/ChartLab.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$P" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $V" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $V" "$P" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $V" "$P"
          codesign --force --deep --sign - dist/ChartLab.app
          codesign --verify --deep dist/ChartLab.app
      - name: Check the built app starts in MCP mode
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' | dist/ChartLab.app/Contents/MacOS/ChartLab --mcp | head -c 300
      - name: Open the real window (no screen), load bars, run a strategy
        run: |
          dist/ChartLab.app/Contents/MacOS/ChartLab --version
          dist/ChartLab.app/Contents/MacOS/ChartLab --selftest
      - name: Zip app
        run: ditto -c -k --keepParent dist/ChartLab.app "ChartLab-${VERSION}-mac-m1.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ChartLab-mac-m1
          path: ChartLab-*.zip

